name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "step2/**"
  pull_request:
    branches: [main, master]
    paths:
      - "step2/**"

defaults:
  run:
    working-directory: step2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv pip install --system -r pyproject.toml --no-sources
      - run: mkdir -p src/data/entry src/data/output src/models src/logs
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest tests/ -v --tb=short -m "not integration"
