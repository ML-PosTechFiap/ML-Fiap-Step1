[project]
name = "ml-step2"
version = "0.2.0"
description = "Telco Churn — Step 2: Clean training pipeline (5 models, AUC/F1/Recall, MLflow)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "mlflow>=3.10.1",
    "numpy>=2.4.3",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
    "python-dotenv>=1.1.0",
    "scipy>=1.16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.11.0",
]
