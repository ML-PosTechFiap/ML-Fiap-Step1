name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "step3/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "step3/**"

defaults:
  run:
    working-directory: step3

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check src/

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install CPU torch first
        run: uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: uv pip install --system -r pyproject.toml --no-sources

      - name: Create required directories
        run: mkdir -p src/data/entry src/data/output src/models src/logs src/graphs

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest tests/ -v --tb=short -m "not integration"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: step3
          push: false
          tags: ml-step3:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
