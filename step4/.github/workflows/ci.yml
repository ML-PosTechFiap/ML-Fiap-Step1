name: CI — Step 4

on:
  push:
    branches: [main, master, feature-step4]
    paths:
      - "step4/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "step4/**"

defaults:
  run:
    working-directory: step4

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  test:
    name: Unit & API Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install CPU torch
        run: uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: uv pip install --system -r pyproject.toml --no-sources

      - name: Create required directories
        run: mkdir -p src/models src/logs src/graphs

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest tests/ -v --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: step4
          push: false
          tags: ml-step4:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
