site_name: Telco Churn Prediction — Tech Challenge Fase 1
site_description: Pipeline end-to-end de ML para previsão de churn em telecomunicações
site_author: ML-PosTech-FIAP
docs_dir: docs

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Roteiro do Vídeo: roteiro.md
  - Documentação Técnica:
    - ML Canvas: ML_CANVAS.md
    - Model Card: MODEL_CARD.md
    - Arquitetura de Deploy: DEPLOY_ARCHITECTURE.md
    - Plano de Monitoramento: MONITORING_PLAN.md
